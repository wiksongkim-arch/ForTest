name: Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v0.2.16
        type: string

# 发布流程仅在发布步骤使用 GitHub 短期令牌，不保存长期凭据。
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            windows_native/requirements-build.txt
            windows_native/requirements-runtime.txt

      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Verify tag and version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath windows_native/VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag $env:RELEASE_TAG does not match VERSION $version."
          }

          # 标签必须准确指向当前检出提交，避免错误源码进入正式发布。
          $headCommit = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($headCommit -ne $tagCommit) {
            throw "Tag $env:RELEASE_TAG does not point to the checked-out commit."
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install verified Inno Setup 7
        shell: pwsh
        run: |
          $downloadUrl = "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe"
          $expectedHash = "5AD54CA3DEF786F8F4212552E54CC6D8D61329E2D24A1CFEE0571D42C2684FF1"
          $setupPath = Join-Path $env:RUNNER_TEMP "innosetup-7.0.2-x64.exe"
          $installPath = Join-Path $PWD "windows_native/.tools/Inno Setup 7"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $setupPath
          $actualHash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup download hash verification failed."
          }

          # 同时校验发布者签名，未验证的编译器不得进入发布链。
          $signature = Get-AuthenticodeSignature -LiteralPath $setupPath
          if (
            $signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
            $signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\."
          ) {
            throw "Inno Setup publisher verification failed."
          }

          $setupArguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=`"$installPath`""
          )
          $setupProcess = Start-Process -FilePath $setupPath -ArgumentList $setupArguments -Wait -PassThru
          if ($setupProcess.ExitCode -ne 0) {
            throw "Failed to install Inno Setup 7."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installPath "ISCC.exe"))) {
            throw "Inno Setup 7 compiler was not installed."
          }

      - name: Build, test, and audit the installer
        # 使用中性构建身份，避免托管机默认用户数据进入产物或隐私扫描。
        env:
          LOGNAME: ForTestBuildUser
          USER: ForTestBuildUser
          LNAME: ForTestBuildUser
          USERNAME: ForTestBuildUser
          PGPASSWORD: ""
          USERPROFILE: '${{ runner.temp }}\ForTestBuildHome'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:USERPROFILE -Force | Out-Null
          ./windows_native/build.ps1 -Clean

      - name: Prepare release assets and notes
        shell: pwsh
        run: |
          $installerName = "ForTest-Windows-x64-Setup-$env:RELEASE_VERSION.exe"
          $installerPath = Join-Path $PWD "windows_native/dist/installer/$installerName"
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "Installer was not created: $installerPath"
          }

          $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash
          $checksumPath = "$installerPath.sha256"
          [System.IO.File]::WriteAllText(
            $checksumPath,
            "$hash  $installerName`n",
            [System.Text.ASCIIEncoding]::new()
          )

          $notes = @"
          # ForTest v$env:RELEASE_VERSION

          Source-available Windows x64 release of ForTest.

          ## Highlights

          - A default-off EIM Monitoring internal preview can archive DingTalk text, media, quoted-message, and Reaction events to Docs, Sheets, or AI Tables through isolated DWS v1.0.60 connections, immutable task versions, idempotent delivery, disconnect reconciliation, and optional budgeted AI steps.
          - Quick Deploy now redeploys the same task while retaining per-run history, and iteration deployments can be saved without starting.
          - Test Case Generation accepts multiple links, one per line, and creates and starts tasks in input order.
          - Appearance is now a Settings tab immediately after AI Settings.
          - Other settings now provide configurable GitHub Release checks and an explicit Update Now action with download verification.
          - Desktop lifecycle diagnostics record tray/window/session/update exit paths, redacted faults, a 30-second heartbeat, and prior unclean shutdowns for unattended-exit investigation.

          ## Assets

          - ``$installerName``: Windows x64 installer.
          - ``$installerName.sha256``: SHA-256 checksum.

          Installer SHA-256: ``$hash``

          ## Notes

          - Requires 64-bit Windows 10 version 1809 or later, or Windows 11.
          - EIM has not completed real G0 acceptance in an independent test organization. Its entry and background runtime are disabled by default; only controlled testers should enable it with ``FORTEST_ENABLE_EIM=1``.
          - DingTalk's official event stream excludes messages sent by the currently authorized OAuth account. ForTest shows this boundary in the UI and does not bypass it with polling or private APIs.
          - The installer is not Authenticode-signed and Windows may display a SmartScreen warning. Download only from this Release and verify SHA-256 first.
          - Jenkins, model, and document services require the user's own accounts, network access, data, and permissions.
          - Licensed under PolyForm Noncommercial 1.0.0. This is source-available software, not OSI open source; commercial use requires separate written permission.
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$env:RELEASE_VERSION.md"
          [System.IO.File]::WriteAllText(
            $notesPath,
            $notes.Trim() + "`n",
            [System.Text.UTF8Encoding]::new($false)
          )

          "INSTALLER_PATH=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHECKSUM_PATH=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NOTES_PATH=$notesPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseArguments = @(
            "release", "create", $env:RELEASE_TAG,
            $env:INSTALLER_PATH,
            $env:CHECKSUM_PATH,
            "--verify-tag",
            "--title", "ForTest $env:RELEASE_TAG",
            "--notes-file", $env:RELEASE_NOTES_PATH,
            "--latest"
          )
          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed."
          }

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assetNames = gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read the published Release."
          }
          if ($assetNames -notcontains (Split-Path -Leaf $env:INSTALLER_PATH)) {
            throw "Published Release does not contain the installer."
          }
          if ($assetNames -notcontains (Split-Path -Leaf $env:CHECKSUM_PATH)) {
            throw "Published Release does not contain the checksum file."
          }
