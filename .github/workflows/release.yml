name: Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v0.2.14
        type: string

# 发布流程只使用 GitHub 自动签发的短期令牌，不保存长期凭据。
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            windows_native/requirements-build.txt
            windows_native/requirements-runtime.txt

      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Verify tag and version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath windows_native/VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag $env:RELEASE_TAG does not match VERSION $version."
          }

          # 只允许构建指向当前检出提交的现有标签，避免发布错误源码。
          $headCommit = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($headCommit -ne $tagCommit) {
            throw "Tag $env:RELEASE_TAG does not point to the checked-out commit."
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install verified Inno Setup 7
        shell: pwsh
        run: |
          $downloadUrl = "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe"
          $expectedHash = "5AD54CA3DEF786F8F4212552E54CC6D8D61329E2D24A1CFEE0571D42C2684FF1"
          $setupPath = Join-Path $env:RUNNER_TEMP "innosetup-7.0.2-x64.exe"
          $installPath = Join-Path $PWD "windows_native/.tools/Inno Setup 7"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $setupPath
          $actualHash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup download hash verification failed."
          }

          # 下载后同时校验哈希和发布者签名，避免未经验证的编译器进入发布链。
          $signature = Get-AuthenticodeSignature -LiteralPath $setupPath
          if (
            $signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
            $signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\."
          ) {
            throw "Inno Setup publisher verification failed."
          }

          $setupArguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=`"$installPath`""
          )
          $setupProcess = Start-Process -FilePath $setupPath -ArgumentList $setupArguments -Wait -PassThru
          if ($setupProcess.ExitCode -ne 0) {
            throw "Failed to install Inno Setup 7."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installPath "ISCC.exe"))) {
            throw "Inno Setup 7 compiler was not installed."
          }

      - name: Build, test, and audit the installer
        # 使用中性的 CI 构建身份，避免把托管机默认用户或预装服务变量误判为用户数据。
        env:
          LOGNAME: ForTestBuildUser
          USER: ForTestBuildUser
          LNAME: ForTestBuildUser
          USERNAME: ForTestBuildUser
          PGPASSWORD: ""
          USERPROFILE: '${{ runner.temp }}\ForTestBuildHome'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:USERPROFILE -Force | Out-Null
          ./windows_native/build.ps1 -Clean

      - name: Prepare release assets and notes
        shell: pwsh
        run: |
          $installerName = "ForTest-Windows-x64-Setup-$env:RELEASE_VERSION.exe"
          $installerPath = Join-Path $PWD "windows_native/dist/installer/$installerName"
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "Installer was not created: $installerPath"
          }

          $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash
          $checksumPath = "$installerPath.sha256"
          $checksumLine = "$hash  $installerName`n"
          [System.IO.File]::WriteAllText(
            $checksumPath,
            $checksumLine,
            [System.Text.ASCIIEncoding]::new()
          )

          # 以 Base64 解码 UTF-8 中文发布说明，避免依赖托管机的默认代码页。
          $notesBase64 = ""
          $notesTemplate = [System.Text.Encoding]::UTF8.GetString(
            [System.Convert]::FromBase64String($notesBase64)
          )
          $notes = $notesTemplate.Replace("__VERSION__", $env:RELEASE_VERSION).Replace("__SHA256__", $hash)
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$env:RELEASE_VERSION.md"
          [System.IO.File]::WriteAllText(
            $notesPath,
            $notes.Trim() + "`n",
            [System.Text.UTF8Encoding]::new($false)
          )

          "INSTALLER_PATH=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHECKSUM_PATH=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NOTES_PATH=$notesPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseArguments = @(
            "release", "create", $env:RELEASE_TAG,
            $env:INSTALLER_PATH,
            $env:CHECKSUM_PATH,
            "--verify-tag",
            "--title", "ForTest $env:RELEASE_TAG",
            "--notes-file", $env:RELEASE_NOTES_PATH,
            "--latest"
          )
          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed."
          }

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assetNames = gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read the published Release."
          }
          if ($assetNames -notcontains (Split-Path -Leaf $env:INSTALLER_PATH)) {
            throw "Published Release does not contain the installer."
          }
          if ($assetNames -notcontains (Split-Path -Leaf $env:CHECKSUM_PATH)) {
            throw "Published Release does not contain the checksum file."
          }
