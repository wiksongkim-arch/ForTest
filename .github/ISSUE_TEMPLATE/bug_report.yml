name: 缺陷报告
description: 报告可以稳定复现的程序问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请先删除日志中的凭据、个人路径和真实业务数据。
  - type: input
    id: version
    attributes:
      label: ForTest 版本
      placeholder: 例如 0.2.12
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: 例如 Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供可以重复执行的最小步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充材料
      description: 可粘贴已脱敏日志或截图；请勿公开安全漏洞、密钥或客户数据。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我已移除凭据、个人信息和真实业务数据。
          required: true
